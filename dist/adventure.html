<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#263d32"><title>知识副本 · 失落的档案馆</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="#" id="home"><span>✦</span><div>知识副本<small>把知识用进一次冒险</small></div></a><nav><button id="guide">玩法说明</button><button id="book">知识与词语</button><button id="menu" aria-label="打开游戏菜单">☰ 菜单</button></nav></header>
<section id="welcome" class="welcome"><div class="welcome-shade"></div><div class="welcome-copy"><p class="eyebrow">一场有起点、有解谜、有结局的学习冒险</p><h1 id="welcomeTitle">失落的<br><em>档案馆</em></h1><p class="welcome-story">岛上的帮手接错了任务，机器也把步骤弄乱了。<br>作为新来的修复师，你要找到问题、动手修好，<br>最后把学会的方法带到另一座岛。</p><div class="welcome-promises"><span>① 调查线索</span><span>② 动手解决</span><span>③ 看见后果</span></div><button id="start" class="primary large">开始冒险 · 先学会怎么玩 →</button><button id="continue" class="secondary" hidden>继续上次的冒险 →</button><button id="restartWelcome" class="textbtn" hidden>重新开始（会清空本章进度）</button><p class="welcome-controls">鼠标点击或触屏操作 · 四个可进入地点 · 进度自动保存</p><button id="openingInfo" class="textbtn light">先看游戏介绍 ↗</button></div><div class="welcome-caption"><span>第一章</span><b>森屿学院</b><small>完成四次修复，点亮塔顶的灯。</small></div></section>
<main id="game" hidden><div class="game-top"><div><span id="sceneChapter" class="eyebrow"></span><h1 id="sceneTitle"></h1></div><div class="game-stats"><span id="rank">见习修复师</span><b id="xp">经验 0</b><button id="satchel">◇ 行囊 <span id="itemCount">0</span></button><button id="backMap" class="outline" hidden>← 返回学院地图</button></div></div>
<div class="objective-bar"><span>当前目标</span><b id="objective"></b><button id="hint">我卡住了，给我一步提示 →</button></div>
<section class="adventure"><div class="scene-column"><div class="scene-viewport" id="sceneViewport"><div class="scene-canvas" id="sceneCanvas"><img id="sceneArt" src="assets/academy-map.webp" alt="森屿学院地图"><div class="scene-vignette"></div><div id="worldState" class="world-state" aria-hidden="true"></div><div id="objects"></div><div id="player" class="player" aria-hidden="true"><svg viewBox="0 0 60 80"><ellipse cx="30" cy="73" rx="17" ry="5" fill="#24412e44"/><path d="M15 65l5-28h20l5 28-15 6z" fill="#476b51"/><path d="M21 65l-2 11m20-11 2 11" stroke="#6d573c" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="28" r="11" fill="#edc69f"/><path d="M13 27L25 4l21 23z" fill="#b47f51"/><ellipse cx="29" cy="27" rx="18" ry="4" fill="#b47f51"/><path d="M21 39l9 10 9-10" fill="#ead6a5"/></svg></div><div id="transition" class="scene-transition" aria-hidden="true"></div></div></div><div class="scene-strip"><span id="sceneTip"></span><button id="motion">✧ 暂停动效</button></div><div id="milestones" class="milestones"></div></div>
